<section class="game">
  <div class="top">
    <hangman-guesses-bar
      [maxGuesses]="maxGuesses"
      [guessesLeft]="guessesLeft">
    </hangman-guesses-bar>

    <hangman-word
      [word]="word"
      [guessedLetters]="guessedLetters">
    </hangman-word>
  </div>

  <hangman-keyboard
    [guessedLetters]="guessedLetters"
    (letterGuessed)="onGuess($event)">
  </hangman-keyboard>
</section>
