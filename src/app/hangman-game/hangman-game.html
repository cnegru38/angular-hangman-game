<section class="game">
  <div class="top">
    <hangman-guesses-bar
      [maxGuesses]="maxGuesses"
      [guessesLeft]="guessesLeft">
    </hangman-guesses-bar>

    <hangman-word
      [word]="word"
      [guessedLetters]="guessedLetters">
    </hangman-word>
  </div>

  <p *ngIf="hasWon" class="win">
  You Win!
  </p>

  <p *ngIf="hasLost" class="lose">
  Game Over!
  </p>

  <p
  class="attempts"
  [class.warn]="isWarning"
  [class.danger]="isDanger">
  Remaining attempts: {{ guessesLeft }}
  </p>

  <hangman-keyboard
  [guessedLetters]="guessedLetters"
  [disabled]="isGameOver"
  (letterGuessed)="onGuess($event)">
  </hangman-keyboard>

  <p class="guessed">
  Guessed letters: {{ guessedLettersList }}
  </p>

  <button
  *ngIf="isGameOver"
  class="reset"
  (click)="resetGame()">
  New Game
  </button>

</section>
