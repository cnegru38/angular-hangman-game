<section class="game">
  <div class="top">
    <hangman-guesses-bar
      [maxGuesses]="maxGuesses"
      [guessesLeft]="guessesLeft">
    </hangman-guesses-bar>

    <hangman-word
      [word]="word"
      [guessedLetters]="guessedLetters">
    </hangman-word>
  </div>

  <p
  class="attempts"
  [class.warn]="isWarning"
  [class.danger]="isDanger">
  Remaining attempts: {{ guessesLeft }}
  </p>

  <hangman-keyboard
    [guessedLetters]="guessedLetters"
    (letterGuessed)="onGuess($event)">
  </hangman-keyboard>

  <p class="guessed">
  Guessed letters: {{ guessedLettersList }}
  </p>

</section>
